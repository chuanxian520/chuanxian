<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>穿线下单</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑;}
body{background:#f5f7fa;padding:30px;}
.box{max-width:600px;margin:0 auto;background:#fff;padding:30px;border-radius:12px;}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
h2{text-align:center;margin-bottom:20px;}
.item{margin-bottom:15px;}
label{display:block;margin-bottom:6px;}
input,select,textarea{width:100%;padding:10px;border:1px solid #eee;border-radius:6px;}
button{width:100%;padding:12px;background:#007bff;color:#fff;border:none;border-radius:6px;}
a{color:#007bff;text-decoration:none;}
</style>
</head>
<body>
<div class="box">
  <div class="top-bar">
    <h2>羽毛球穿线下单</h2>
    <div>
      <a href="/my-orders.html">我的订单</a>
      <a href="/logout">退出</a>
    </div>
  </div>
  <form action="/submit-order" method="post">
    <div class="item"><label>球拍型号 *</label><input name="racketType" required></div>
    <div class="item"><label>球线型号 *</label><select name="stringName" id="sl" required></select></div>
    <div class="item"><label>竖线磅数 *</label><input name="mainTension" required></div>
    <div class="item"><label>横线磅数 *</label><input name="crossTension" required></div>
    <div class="item"><label>联系电话 *</label><input name="phone" required></div>
    <div class="item"><label>取件地址</label><input name="address"></div>
    <div class="item"><label>备注说明</label><textarea name="remark" rows="3"></textarea></div>
    <button>提交订单</button>
  </form>
</div>
<script>
fetch("/api/string-list").then(r=>r.json()).then(list=>{
  list.forEach(s=>{
    sl.innerHTML += `<option>${s.string_name}</option>`;
  });
});
</script>
</body>
</html>
