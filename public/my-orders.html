<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>我的订单</title>
<style>
body{background:#f5f5f5;padding:15px}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:12px}
.status{color:red;font-weight:bold}
.payimg{width:180px;display:block;margin:10px auto}
</style>
<div id="app"></div>
<script>
fetch('/api/my-orders').then(r=>r.json()).then(list=>{
  let html = '';
  list.forEach(o=>{
    html+=`
    <div class="card">
      <div>订单：${o.orderNo}</div>
      <div>线材：${o.stringName}</div>
      <div>合计：${o.totalPrice}元</div>
      <div>状态：<span class="status">${o.status}</span></div>
      ${o.status=='待支付'?`
      <div style="text-align:center;color:red">请扫码支付</div>
      <img src="wx-pay-code.jpg" class="payimg">
      <div style="text-align:center">支付后请联系商家</div>
      `:''}
    </div>`
  });
  document.getElementById('app').innerHTML=html;
})
</script>
