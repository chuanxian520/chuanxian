<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>我的订单</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑;}
body{background:#f5f7fa;padding:30px;}
.box{max-width:1000px;margin:0 auto;background:#fff;padding:30px;border-radius:12px;}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
a{color:#007bff;text-decoration:none;margin:0 10px;}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #eee;padding:10px;text-align:center;}
th{background:#f8f9fa;}
</style>
</head>
<body>
<div class="box">
  <div class="top-bar">
    <h2>我的穿线订单</h2>
    <div>
      <a href="/">继续下单</a>
      <a href="/logout">退出登录</a>
    </div>
  </div>

  <table>
    <tr>
      <th>订单号</th>
      <th>球拍</th>
      <th>球线</th>
      <th>竖线磅数</th>
      <th>横线磅数</th>
      <th>联系电话</th>
      <th>地址</th>
      <th>备注</th>
      <th>状态</th>
    </tr>
    <tbody id="myOrders"></tbody>
  </table>
</div>

<script>
// 未登录跳转到登录页
if(!document.cookie.includes("user=")){
  alert("请先登录！");
  location.href = "/login.html";
}

// 加载自己的订单
fetch("/api/my-orders")
.then(res=>res.json())
.then(list=>{
  let html = "";
  if(list.length === 0){
    myOrders.innerHTML = `<tr><td colspan="9">暂无订单</td></tr>`;
    return;
  }
  list.forEach(v=>{
    html += `
    <tr>
      <td>${v.orderNo}</td>
      <td>${v.racketType}</td>
      <td>${v.stringName}</td>
      <td>${v.mainTension}</td>
      <td>${v.crossTension}</td>
      <td>${v.phone}</td>
      <td>${v.address||"-"}</td>
      <td>${v.remark||"-"}</td>
      <td>${v.status}</td>
    </tr>`;
  });
  myOrders.innerHTML = html;
});
</script>
</body>
</html>
