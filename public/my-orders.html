<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>我的订单</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑}
body{background:#f3f4f6;padding:20px}
.box{max-width:600px;margin:30px auto;background:#fff;padding:25px;border-radius:12px}
h2{text-align:center;margin-bottom:20px}
.order{border:1px solid #eee;border-radius:8px;padding:15px;margin-bottom:10px}
.pay-btn{padding:8px 14px;background:#07C160;color:white;border:none;border-radius:6px;margin-top:6px}
a{color:#007AFF;text-decoration:none;margin-right:10px}
</style>
</head>
<body>
<div class="box">
  <a href="index.html">返回下单</a>
  <a href="logout">退出登录</a>
  <h2>我的订单</h2>
  <div id="orderList"></div>
</div>

<script>
function loadOrders() {
  fetch("/api/my-orders")
    .then(res => res.json())
    .then(list => {
      let html = "";
      if (list.length === 0) {
        html = "<p>暂无订单</p>";
      } else {
        list.forEach(item => {
          html += `
          <div class="order">
            <p>订单号：${item.orderNo}</p>
            <p>球线：${item.stringName}｜护线管：${item.pipe}</p>
            <p>磅数：${item.mainTension}/${item.crossTension}</p>
            <p>应付总价：¥${item.totalPrice}</p>
            <p>状态：${item.status}</p>
            ${item.status === "未支付" 
              ? `<button class="pay-btn" onclick="goToPayPage('${item.orderNo}')">去支付</button>` 
              : "<p style='color:#666'>请等待管理员处理</p>"}
          </div>`;
        });
      }
      document.getElementById("orderList").innerHTML = html;
    });
}

function goToPayPage(orderNo) {
  window.location.href = "/pay-weixin?orderNo=" + orderNo;
}

loadOrders();
</script>
</body>
</html>
