<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑;}
body{background:#f5f7fa;padding:30px;}
.wrap{max-width:1200px;margin:0 auto;background:#fff;padding:30px;border-radius:12px;}
.login-box{text-align:center;margin-top:80px;}
.login-box input{width:260px;padding:12px;border:1px solid #eee;border-radius:6px;}
.login-box button{padding:12px 30px;background:#007bff;color:#fff;border:none;border-radius:6px;margin-top:15px;}
.admin-main{display:none;}
.top-bar{display:flex;justify-content:space-between;align-items:center;}
.logout{color:#f56c6c;}
h3{margin:20px 0 10px;}
.form-row{display:flex;gap:10px;align-items:center;margin-bottom:15px;}
input{padding:10px;border:1px solid #eee;border-radius:6px;}
button{padding:9px 18px;background:#007bff;color:#fff;border:none;border-radius:6px;}
.btn-del{background:#f56c6c;}
hr{margin:30px 0;border-top:1px solid #eee;}
table{width:100%;border-collapse:collapse;}
th,td{border:1px solid #eee;padding:10px;text-align:center;}
th{background:#f8f9fa;}
</style>
</head>
<body>
<div class="wrap">
  <div class="login-box" id="loginBox">
    <h2>管理员登录</h2>
    <form action="/admin-login" method="post">
      <input type="password" name="pwd" placeholder="密码" required>
      <br>
      <button>登录</button>
    </form>
  </div>

  <div class="admin-main" id="adminMain">
    <div class="top-bar">
      <h2>穿线管理后台</h2>
      <a href="/logoutAdmin" class="logout">退出</a>
    </div>

    <h3>修改密码</h3>
    <form action="/change-admin-pwd" method="post" class="form-row">
      <input name="newPwd" placeholder="新密码" required>
      <button>确认</button>
    </form>

    <hr>
    <h3>球线管理</h3>
    <form action="/admin/add-string" method="post" class="form-row">
      <input name="name" placeholder="球线名称" required>
      <button>添加</button>
    </form>
    <div id="stringList"></div>

    <hr>
    <h3>订单管理（含地址、备注、删除）</h3>
    <table>
      <tr>
        <th>用户</th><th>订单号</th><th>球拍</th><th>球线</th><th>竖</th><th>横</th><th>手机</th><th>地址</th><th>备注</th><th>状态</th><th>操作</th><th>删除</th>
      </tr>
      <tbody id="allOrder"></tbody>
    </table>
  </div>
</div>

<script>
if(document.cookie.includes("adminAuth=ok")){
  loginBox.style.display="none"
  adminMain.style.display="block"
  loadData()
}

function loadData(){
  fetch("/api/all-orders").then(r=>r.json()).then(list=>{
    let html=""
    list.forEach(v=>{
      html+=`
      <tr>
        <td>${v.username||"-"}</td>
        <td>${v.orderNo}</td>
        <td>${v.racketType}</td>
        <td>${v.stringName}</td>
        <td>${v.mainTension}</td>
        <td>${v.crossTension}</td>
        <td>${v.phone}</td>
        <td>${v.address||"-"}</td>
        <td>${v.remark||"-"}</td>
        <td>${v.status}</td>
        <td>
          <form action="/update-order-status" method="post">
            <input type="hidden" name="orderNo" value="${v.orderNo}">
            <select name="status" onchange="this.form.submit()">
              <option ${v.status=="待处理"?"selected":""}>待处理</option>
              <option ${v.status=="处理中"?"selected":""}>处理中</option>
              <option ${v.status=="已完成"?"selected":""}>已完成</option>
            </select>
          </form>
        </td>
        <td>
          <form action="/admin/del-order" method="post" onsubmit="return confirm('确定删除？')">
            <input type="hidden" name="orderNo" value="${v.orderNo}">
            <button class="btn-del">删</button>
          </form>
        </td>
      </tr>`
    })
    allOrder.innerHTML=html
  })

  fetch("/api/string-list").then(r=>r.json()).then(list=>{
    let sh=""
    list.forEach(item=>{
      sh+=`
      <div class="form-row">
        <span>${item.string_name}</span>
        <form action="/admin/del-string" method="post">
          <input type="hidden" name="id" value="${item.id}">
          <button class="btn-del">删除</button>
        </form>
      </div>`
    })
    stringList.innerHTML=sh
  })
}
</script>
</body>
</html>
