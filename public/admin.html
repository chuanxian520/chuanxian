<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>管理后台</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑}
body{background:#f3f4f6;padding:20px}
.box{max-width:800px;margin:0 auto;background:#fff;padding:25px;border-radius:12px}
h2{text-align:center;margin-bottom:20px}
h3{margin:20px 0 10px;color:#007AFF}
form{margin:10px 0;padding:10px;border:1px solid #eee;border-radius:8px}
input{padding:6px;margin:0 5px}
button{padding:6px 12px;background:#07C160;color:white;border:none;border-radius:6px}
table{width:100%;border-collapse:collapse;margin:15px 0}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
a{color:#007AFF;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <h2>管理后台</h2>
  <a href="/admin-logout">退出登录</a>

  <h3>球线管理（设置价格）</h3>
  <form action="/admin/add-string" method="post">
    球线名：<input name="name" required>
    价格：<input name="price" required>
    <button>添加</button>
  </form>
  <table>
    <tr><th>ID</th><th>球线</th><th>价格</th><th>操作</th></tr>
    <tbody id="stringList"></tbody>
  </table>

  <h3>护线管价格设置</h3>
  <form action="/admin/set-pipe" method="post">
    价格：<input name="price" id="pipePrice" required>
    <button>保存</button>
  </form>
  <p>当前护线管价格：¥<span id="nowPipe"></span></p>

  <h3>订单管理（修改状态）</h3>
  <table>
    <tr><th>订单号</th><th>用户</th><th>球线</th><th>总价</th><th>状态</th><th>操作</th></tr>
    <tbody id="orderList"></tbody>
  </table>

  <h3>修改管理员密码</h3>
  <form action="/change-admin-pwd" method="post">
    新密码：<input name="newPwd" required>
    <button>修改</button>
  </form>
</div>

<script>
function loadStrings(){
  fetch("/api/string-list").then(r=>r.json()).then(data=>{
    let h="";
    data.forEach(s=>{
      h+=`<tr>
        <td>${s.id}</td>
        <td>${s.string_name}</td>
        <td>¥${s.price}</td>
        <td>
          <form action="/admin/del-string" method="post" style="display:inline">
            <input type="hidden" name="id" value="${s.id}">
            <button style="background:red">删除</button>
          </form>
        </td>
      </tr>`;
    });
    document.getElementById("stringList").innerHTML=h;
  })
}

function loadPipe(){
  fetch("/api/pipe-price").then(r=>r.json()).then(d=>{
    document.getElementById("nowPipe").innerText=d.price;
    document.getElementById("pipePrice").value=d.price;
  })
}

function loadOrders(){
  fetch("/api/all-orders").then(r=>r.json()).then(data=>{
    let h="";
    data.forEach(o=>{
      h+=`<tr>
        <td>${o.orderNo}</td>
        <td>${o.username}</td>
        <td>${o.stringName}</td>
        <td>¥${o.totalPrice}</td>
        <td>${o.status}</td>
        <td>
          <form action="/update-order-status" method="post" style="display:inline">
            <input type="hidden" name="orderNo" value="${o.orderNo}">
            <select name="status" onchange="this.form.submit()">
              <option value="未支付" ${o.status=="未支付"?"selected":""}>未支付</option>
              <option value="已支付" ${o.status=="已支付"?"selected":""}>已支付</option>
              <option value="进行中" ${o.status=="进行中"?"selected":""}>进行中</option>
              <option value="已完成" ${o.status=="已完成"?"selected":""}>已完成</option>
            </select>
          </form>
          <form action="/admin/del-order" method="post" style="display:inline">
            <input type="hidden" name="orderNo" value="${o.orderNo}">
            <button style="background:red">删</button>
          </form>
        </td>
      </tr>`;
    });
    document.getElementById("orderList").innerHTML=h;
  })
}

loadStrings();
loadPipe();
loadOrders();
</script>
</body>
</html>
