<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>登录</title>
<style>
body{background:#f5f5f5;padding:30px}
.box{max-width:360px;margin:50px auto;background:#fff;padding:30px;border-radius:16px;text-align:center}
.btn{width:100%;height:50px;background:#07c160;color:#fff;border:none;border-radius:8px;font-size:16px;margin:8px 0}
input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
</style>
<div class="box">
  <h2>账号登录</h2>
  <form action="/do-login" method="post">
    <input type="text" name="username" placeholder="账号" required>
    <input type="password" name="password" placeholder="密码" required>
    <button class="btn" type="submit">登录</button>
  </form>
  <a href="/register.html">没有账号？去注册</a>
</div>
