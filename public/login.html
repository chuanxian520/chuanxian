<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>登录</title>
<style>
body{background:#f5f5f5;padding:30px}
.box{max-width:360px;margin:50px auto;background:#fff;padding:30px;border-radius:16px;text-align:center}
.btn{width:100%;height:50px;background:#07c160;color:#fff;border:none;border-radius:8px;font-size:16px}
</style>
<div class="box">
  <h2>微信登录</h2>
  <button class="btn" onclick="login()">微信一键登录</button>
</div>
<script>
function login(){
  const appid = "wx9feec4bdaea6a15c";
  const redirect = encodeURIComponent("https://"+window.location.host+"/wx/callback");
  location.href = "https://open.weixin.qq.com/connect/oauth2/authorize?appid="+appid+"&redirect_uri="+redirect+"&response_type=code&scope=snsapi_userinfo#wechat_redirect";
}
</script>
