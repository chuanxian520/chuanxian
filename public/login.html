<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>用户登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑;}
body{background:#f5f7fa;padding:30px;}
.box{max-width:400px;margin:80px auto;background:#fff;padding:30px;border-radius:12px;text-align:center;}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #eee;border-radius:6px;}
button{width:100%;padding:12px;background:#007bff;color:#fff;border:none;border-radius:6px;}
a{color:#007bff;text-decoration:none;margin:0 10px;}
</style>
</head>
<body>
<div class="box">
  <h2>用户登录</h2>
  <form action="/login" method="post">
    <input name="username" placeholder="用户名" required>
    <input type="password" name="password" placeholder="密码" required>
    <button>登录</button>
  </form>
  <br>
  <a href="/register.html">注册账号</a>
</div>
</body>
</html>
