<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑";}
body{background:#f3f4f6;padding:20px;}
.box{max-width:400px;margin:50px auto;background:#fff;padding:30px;border-radius:12px;}
h2{text-align:center;margin-bottom:20px;}
input{width:100%;padding:14px;margin-bottom:12px;border:1px solid #ddd;border-radius:8px;font-size:16px;}
button{width:100%;padding:14px;background:#007AFF;color:#fff;border:none;border-radius:8px;font-size:16px;}
.to-reg{text-align:center;margin-top:15px;}
.to-reg a{color:#007AFF;text-decoration:none;}
</style>
</head>
<body>
<div class="box">
  <h2>登录</h2>
  <form action="/do-login" method="post">
    <input type="text" name="username" placeholder="请输入账号" required>
    <input type="password" name="password" placeholder="请输入密码" required>
    <button type="submit">登录</button>
  </form>
  <div class="to-reg">
    没有账号？<a href="register.html">去注册</a>
  </div>
</div>
</body>
</html>
